# Puzzle Bot configuration.
#
# Everything the application needs lives in this file. Values changed through
# the GUI are written back into the [ui] table automatically (comments are kept,
# directories are stored relative to the repository root).

[app]
title = "JIGSAW"

# ---------------------------------------------------------------------------
# Serial devices (matched by USB VID:PID, see `puzzle-bot` -> `status`)
# ---------------------------------------------------------------------------

[serial.clearcore]
# Teknic ClearCore motion controller (XYZ gantry + vacuum)
port_id = "VID:PID=2890:8022"
baud_rate = 9600

[serial.gripper]
# Arduino Due gripper controller (rotation, encoder, eyes, LEDs)
port_id = "VID:PID=2341:003D"
baud_rate = 9600

[serial.dummy_clearcore]
# Optional: Arduino Uno running Arduino/Dummy-MotionController
port_id = "VID:PID=2341:0043"
baud_rate = 9600

# ---------------------------------------------------------------------------
# File locations (relative paths resolve against the repo root)
# ---------------------------------------------------------------------------

[paths]
# Measured height of the assembly table used by the wiggle routines
table_height_map = "data/solution_table_height.csv"
# Directory holding marker files that enable routines: spiral_on, grid_on, scoot_on
feature_flags_dir = "flags"

# ---------------------------------------------------------------------------
# Robot mechanics (all values in motor counts / encoder counts)
# ---------------------------------------------------------------------------

[robot]
encoder_fully_extended = 5150
minimum_piece_thickness_encoder_counts = 1400
encoder_counts_per_z_motor_count = 0.93357142857
max_rotation_motor_counts = 65536
rotation_motor_counts_per_degree = 182
safe_travel_z = 15000
dropoff_z = 7000
pickup_z = 7000
scoot_z = 8600
wiggle_z = 10000
camera_z = 136000
input_image_width = 4000
solution_motor_origin = [78285, 308000]
table_height_map_measurement_z = 6000
# Gripper "eye" servo: neutral angle and offset when pointing in the travel direction
neutral_eye_angle = 90
eye_travel_offset = 60

# ---------------------------------------------------------------------------
# Demo mode (simulated hardware)
# ---------------------------------------------------------------------------

[demo]
# Photos served by the fake camera; mock photos are generated when empty
photos_dir = "data/demo_photos"
# Simulated serial response latency
response_delay_ms = 200
# Auto-create the directories configured in [ui] when missing
auto_create_dirs = true

# ---------------------------------------------------------------------------
# UI state - persisted automatically by the GUI
# ---------------------------------------------------------------------------

